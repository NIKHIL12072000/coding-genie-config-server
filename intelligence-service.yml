server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/coding-genie-intelligence-db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  ai:
    model.chat: openai
    openai:
      api-key: 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
      base-url: https://openrouter.ai/api/v1
    chat:
      options:
        model: nvidia/nemotron-3-super-120b-a12b:free
        temperature: 0.0

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.coding-genie.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}

  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://openrouter.ai/api/v1
    chat:
      options:
        model: nvidia/nemotron-3-super-120b-a12b:free
