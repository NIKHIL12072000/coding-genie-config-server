server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/coding-genie-intelligence-db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  ai:
    model.chat: openai
    openai:
      api-key: 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
      base-url: https://models.inference.ai.azure.com
    chat:
      options:
        model: openai/gpt-4.1-mini
        temperature: 0.0
      embedding:
        options:
          model: qwen/qwen3-embedding-8b

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.coding-genie.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}

  ai:
    openai:
      api-key: ${AI_API_KEY}
    chat:
        options:
          model: openai/gpt-4.1-mini
